<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coffee Atlas —— 我的个人咖啡豆图鉴：记录喝过的每一款豆子、每一次冲煮，以及产地足迹。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Coffee Atlas · 我的个人咖啡豆图鉴" />
    <meta
      property="og:description"
      content="记录喝过的每一款豆子、每一次冲煮，以及它们背后的产地故事。"
    />
    <meta name="theme-color" content="#684833" />
    <title>Coffee Atlas · 我的个人咖啡豆图鉴</title>
    <script>
      // 首屏前应用主题，避免暗色模式闪白
      try {
        var t = localStorage.getItem('coffee-atlas:theme')
        if (
          t === 'dark' ||
          (!t && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
